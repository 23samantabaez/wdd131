<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Card</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">

    <section class="character-info">
        <img class="character-image" src="images/snortleblat-img.webp" alt="Snortleblat, a swamp beast">
        <h1 class="character-name">Snortleblat</h1>
        <p><strong>Class:</strong> <span id="character-class">Swamp Beast Diplomat</span></p>
        <p><strong>Level:</strong> <span id="level">5</span></p>
        <p><strong>Health:</strong> <span id="health">80</span></p>

        <div class="buttons">
        <button type="button" id="attack-button">Attacked</button>
        <button type="button" id="level-up-button">Level Up</button>
        </div>
    </section>
    
  </main>
</body>
</html>
