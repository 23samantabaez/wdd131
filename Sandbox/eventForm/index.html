<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Ticket Form</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" xmlns="http://www.w3.org/2000/svg">
  <script src="scripts.js" defer></script>
</head>
<body>
  <main class="page-wrapper">
    <section class="card">
      <h1>Event Ticket Form</h1>

      <form id="event-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="firstName" required>
          </div>

          <div class="form-group">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="lastName" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="attendee-type">Type</label>
            <select id="attendee-type" name="attendeeType" required>
              <option value="">Choose one</option>
              <option value="student">Student</option>
              <option value="guest">Guest</option>
            </select>
          </div>

          <div class="form-group">
            <label for="event-date">Event Date</label>
            <input type="date" id="event-date" name="eventDate" required>
          </div>
        </div>

        <div class="form-group hidden" id="code-group">
          <label for="code-input" id="code-label">Student I#</label>
          <input type="text" id="code-input" name="code">
        </div>

        <button type="submit">Create Ticket</button>
      </form>

      <div id="errors" class="errors" role="alert"></div>
      <div id="ticket" class="ticket hidden"></div>
    </section>
  </main>
</body>
</html>
